[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soweak"
version = "3.5.0"
description = "OWASP LLM Top 10 security middleware framework for Python: input/output/retrieval/tool-call boundary hooks, prompt-injection detection, canary-based system-prompt leakage detection, audit logging, and adapters for LangChain, OpenAI, and Google Gemini."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Soubhik Ghosh", email = "99ghoshsoubhik@gmail.com"},
]
maintainers = [
    {name = "Soubhik Ghosh", email = "99ghoshsoubhik@gmail.com"},
]
keywords = [
    "llm-security",
    "prompt-injection",
    "prompt-injection-detection",
    "owasp",
    "owasp-llm",
    "owasp-top-10",
    "ai-security",
    "ml-security",
    "guardrails",
    "ai-guardrails",
    "llm-firewall",
    "prompt-firewall",
    "jailbreak-detection",
    "red-teaming",
    "ai-red-team",
    "security-middleware",
    "langchain",
    "openai",
    "gemini",
    "anthropic",
    "claude",
    "rag-security",
    "system-prompt-leakage",
    "canary-tokens",
    "input-validation",
    "output-filtering",
    "audit-log",
    "policy-engine",
    "llm",
    "genai",
    "nlp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Filters",
    "Typing :: Typed",
    "Natural Language :: English",
    "Environment :: Console",
    "Framework :: Pytest",
]

dependencies = []

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.1.0",
]
openai = [
    "openai>=1.0.0",
]
google = [
    "google-generativeai>=0.3.0",
]
otel = [
    "opentelemetry-api>=1.20.0",
]
all = [
    "langchain-core>=0.1.0",
    "openai>=1.0.0",
    "google-generativeai>=0.3.0",
    "opentelemetry-api>=1.20.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "ruff>=0.4.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/SoubhikGhosh/soweak"
Documentation = "https://github.com/SoubhikGhosh/soweak#readme"
Repository = "https://github.com/SoubhikGhosh/soweak"
Issues = "https://github.com/SoubhikGhosh/soweak/issues"
Changelog = "https://github.com/SoubhikGhosh/soweak/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/SoubhikGhosh/soweak/blob/main/ROADMAP.md"

[project.scripts]
soweak = "soweak.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["soweak*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
soweak = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "langchain_core.*",
    "google.generativeai.*",
    "openai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=soweak --cov-report=term-missing"

[tool.coverage.run]
source = ["soweak"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
